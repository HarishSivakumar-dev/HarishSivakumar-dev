<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" width="100%" height="640" style="background:transparent;">
  <defs>
    <style>
      .t-header { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; fill: #8b949e; }
      .t-pencil { font-family: sans-serif; font-size: 14px; fill: #8b949e; }
      .ascii-art { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #c9d1d9; white-space: pre; line-height: 1.25; }
      
      .t-prompt { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: bold; fill: #ffffff; }
      .t-dash   { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; fill: #484f58; }
      
      .t-label  { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #e3b341; }
      .t-dots   { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #30363d; letter-spacing: 1px; }
      .t-val    { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #79c0ff; }
      .t-white  { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #c9d1d9; }
      .t-green  { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #3fb950; font-weight: bold; }
      .t-red    { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #f85149; font-weight: bold; }
    </style>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="1020" height="640" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="30" y="32" class="t-header">HarishSivakumar-dev / README.md</text>
  <text x="975" y="32" class="t-pencil">✏️</text>
  <line x1="15" y1="46" x2="1005" y2="46" stroke="#21262d" stroke-width="1"/>

  <!-- Inner Dark Terminal Container Box -->
  <rect x="20" y="60" width="980" height="560" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>

  <!-- LEFT COLUMN: ASCII Art Silhouette -->
  <g transform="translate(45, 95)">
    <text x="0" y="0" class="ascii-art">
             ::%
           *%%%##
         %@@@@%@%#
     =: -*@@@@@@@@%
    *#++@@@@@@@@@@%#=
  %@@%%##@@@@@%#%%@@@@@=
 %@@@@@@.-=@@@@#*#%@@@@@
%%@@@@@-..::@@@%**=-==@@+=
%%@@@@@@@@@@@@@@@@*****@@%%%#
%@@@@@@@@@@@@@@@@@@@@%**@@@@%@%:@%
%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%%@@%
  %@@@@@@@@@@@@@@@@@@@@@@@@@@@%::
    @@@@@@@@@@@@@@@@@@@@@@@@
    *@@@@@@@@@@@@@@@@@@@@@@@
     %@@@@@@@@@@@@@@@@@@@@@%
     :@@@@@@@@@@@@@@@@@@@@@*
     :-@@@@@@@@@@@@@@@@@@@@
     =-@@@@@@@@@@@@@@@@@@@@*
     =:%@@@@@@@@@@@@@@@@@@%
     =:*@@@@@@@@@@@@@@@@@@%
     .=-%@@@@@@@@@@@@@@@@@@%
     ==-@@@@@@@@@@@@@@@@@@%-
    </text>
  </g>

  <!-- RIGHT COLUMN: Terminal Spec Details -->
  <g transform="translate(420, 95)">
    <!-- Header Prompt Line -->
    <text x="0" y="15">
      <tspan class="t-prompt">harish@sivakumar</tspan>
      <tspan class="t-dash"> -------------------------------------------------</tspan>
    </text>

    <!-- System Info -->
    <text x="0" y="38">
      <tspan class="t-label">. OS:</tspan>
      <tspan class="t-dots"> ............................. </tspan>
      <tspan class="t-val">Linux (Pop!_OS 22.04 LTS)</tspan>
    </text>

    <text x="0" y="59">
      <tspan class="t-label">. Uptime:</tspan>
      <tspan class="t-dots"> ......................... </tspan>
      <tspan class="t-val">3 years (3rd Year ECE)</tspan>
    </text>

    <text x="0" y="80">
      <tspan class="t-label">. Host:</tspan>
      <tspan class="t-dots"> ........................... </tspan>
      <tspan class="t-val">Java Backend &amp; Platform Engineer</tspan>
    </text>

    <text x="0" y="101">
      <tspan class="t-label">. Kernel:</tspan>
      <tspan class="t-dots"> ......................... </tspan>
      <tspan class="t-val">Student (VIT Chennai) Operator</tspan>
    </text>

    <text x="0" y="122">
      <tspan class="t-label">. IDE:</tspan>
      <tspan class="t-dots"> ............................ </tspan>
      <tspan class="t-val">IntelliJ IDEA, VSCode, Neovim</tspan>
    </text>

    <!-- Blank separator line -->
