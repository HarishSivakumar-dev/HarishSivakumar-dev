    <!-- Languages -->
    <text x="0" y="164">
      <tspan class="t-label">. Languages.Programming:</tspan>
      <tspan class="t-dots"> ........ </tspan>
      <tspan class="t-val">Java, C, C++, Python, JavaScript, SQL</tspan>
    </text>

    <text x="0" y="185">
      <tspan class="t-label">. Languages.Computer:</tspan>
      <tspan class="t-dots"> ........... </tspan>
      <tspan class="t-val">HTML, CSS, JSON, Markdown, Shell</tspan>
    </text>

    <text x="0" y="206">
      <tspan class="t-label">. Languages.Real:</tspan>
      <tspan class="t-dots"> ............... </tspan>
      <tspan class="t-val">English, Tamil</tspan>
    </text>

    <!-- Blank separator line -->
    <text x="0" y="227" class="t-dots">.</text>

    <!-- Hobbies -->
    <text x="0" y="248">
      <tspan class="t-label">. Hobbies.Software:</tspan>
      <tspan class="t-dots"> ............ </tspan>
      <tspan class="t-val">Microservices, Distributed Systems, AI/RAG</tspan>
    </text>

    <text x="0" y="269">
      <tspan class="t-label">. Hobbies.Hardware:</tspan>
      <tspan class="t-dots"> ............ </tspan>
      <tspan class="t-val">Embedded Systems, Arduino Projects</tspan>
    </text>

    <text x="0" y="290">
      <tspan class="t-label">. Hobbies.Others:</tspan>
      <tspan class="t-dots"> .............. </tspan>
      <tspan class="t-val">Algorithmic Problem Solving (330+ LeetCode)</tspan>
    </text>

    <!-- Contact Header -->
    <text x="0" y="322">
      <tspan class="t-dash">- Contact -------------------------------------------------------------</tspan>
    </text>

    <text x="0" y="345">
      <tspan class="t-label">. Email.Personal:</tspan>
      <tspan class="t-dots"> ............. </tspan>
      <tspan class="t-val">harishsivakumar.dev@gmail.com</tspan>
    </text>

    <text x="0" y="366">
      <tspan class="t-label">. Email.Work:</tspan>
      <tspan class="t-dots"> .................. </tspan>
      <tspan class="t-val">harishsivakumar.dev@gmail.com</tspan>
    </text>

    <text x="0" y="387">
      <tspan class="t-label">. LinkedIn:</tspan>
      <tspan class="t-dots"> .................... </tspan>
      <tspan class="t-val">harish-sivakumar</tspan>
    </text>

    <text x="0" y="408">
      <tspan class="t-label">. GitHub:</tspan>
      <tspan class="t-dots"> ...................... </tspan>
      <tspan class="t-val">HarishSivakumar-dev</tspan>
    </text>

    <!-- GitHub Stats Header -->
    <text x="0" y="440">
      <tspan class="t-dash">- GitHub Stats --------------------------------------------------------</tspan>
    </text>

    <text x="0" y="463">
      <tspan class="t-label">. Repos:</tspan>
      <tspan class="t-dots"> ........ </tspan>
      <tspan class="t-val">5 {Contributed: 5}</tspan>
      <tspan class="t-dash"> | </tspan>
      <tspan class="t-label">Stars:</tspan>
      <tspan class="t-dots"> ................. </tspan>
      <tspan class="t-val">12</tspan>
    </text>

    <text x="0" y="484">
      <tspan class="t-label">. Commits:</tspan>
      <tspan class="t-dots"> ..... </tspan>
      <tspan class="t-val">330</tspan>
      <tspan class="t-dots">                 | </tspan>
      <tspan class="t-label">Followers:</tspan>
      <tspan class="t-dots"> ............. </tspan>
      <tspan class="t-val">15</tspan>
    </text>

    <text x="0" y="505">
      <tspan class="t-label">. GitHub LOC:</tspan>
      <tspan class="t-dots"> .. </tspan>
      <tspan class="t-val">15,420</tspan>
      <tspan class="t-white"> ( </tspan>
      <tspan class="t-green">+1.66M</tspan>
      <tspan class="t-white">, </tspan>
      <tspan class="t-red">-1.65M</tspan>
      <tspan class="t-white"> )</tspan>
    </text>
  </g>
</svg>
