<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="380" style="background:transparent;">
  <defs>
    <style>
      .sec-title { font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: 900; fill: #ffffff; letter-spacing: 2px; }
      .sec-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #c9d1d9; line-height: 1.5; }
    </style>
  </defs>

  <rect width="850" height="380" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- WHO I AM -->
  <g transform="translate(30, 20)">
