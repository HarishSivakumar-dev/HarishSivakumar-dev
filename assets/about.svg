    <g transform="translate(450, 4)">
      <rect x="0" y="0" width="12" height="10" fill="#2ea043" rx="1"/><rect x="15" y="0" width="12" height="10" fill="#238636" rx="1"/><rect x="30" y="0" width="12" height="10" fill="#3fb950" rx="1"/><rect x="45" y="0" width="12" height="10" fill="#0e4429" rx="1"/><rect x="60" y="0" width="12" height="10" fill="#ffffff" opacity="0.8" rx="1"/><rect x="75" y="0" width="12" height="10" fill="#2ea043" rx="1"/><rect x="90" y="0" width="12" height="10" fill="#238636" rx="1"/><rect x="105" y="0" width="12" height="10" fill="#3fb950" rx="1"/><rect x="120" y="0" width="12" height="10" fill="#0e4429" rx="1"/><rect x="135" y="0" width="12" height="10" fill="#2ea043" rx="1"/><rect x="150" y="0" width="12" height="10" fill="#ffffff" opacity="0.9" rx="1"/><rect x="165" y="0" width="12" height="10" fill="#238636" rx="1"/><rect x="180" y="0" width="12" height="10" fill="#3fb950" rx="1"/><rect x="195" y="0" width="12" height="10" fill="#2ea043" rx="1"/><rect x="210" y="0" width="12" height="10" fill="#0e4429" rx="1"/><rect x="225" y="0" width="12" height="10" fill="#238636" rx="1"/><rect x="240" y="0" width="12" height="10" fill="#3fb950" rx="1"/><rect x="255" y="0" width="12" height="10" fill="#2ea043" rx="1"/><rect x="270" y="0" width="12" height="10" fill="#ffffff" opacity="0.7" rx="1"/><rect x="285" y="0" width="12" height="10" fill="#238636" rx="1"/><rect x="300" y="0" width="12" height="10" fill="#3fb950" rx="1"/>
    </g>
    <text x="0" y="42" class="sec-text">I build software and AI-powered tools that solve real problems – and I can't stop. Obsessed with turning ideas into products</text>
    <text x="0" y="60" class="sec-text">and understanding backend architecture from first principles.</text>
  </g>

