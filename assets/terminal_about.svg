<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 270" width="100%" height="270" style="background:transparent;">
  <defs>
    <style>
      .t-title { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #8b949e; }
      .t-prompt { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: bold; fill: #3fb950; }
      .t-user { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: bold; fill: #58a6ff; }
      .t-path { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: bold; fill: #d2a8ff; }
      .t-cmd { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #f0f6fc; }
      
      /* JSON Syntax Highlighting */
      .j-brace { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #f0f6fc; }
      .j-key { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #79c0ff; }
      .j-str { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #a5d6ff; }
      .j-arr { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #7ee787; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="270" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Window Header -->
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 842,0 A 8,8 0 0,1 850,8 L 850,36 L 0,36 Z" fill="#161b22"/>
  <line x1="0" y1="36" x2="850" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="425" y="22" class="t-title" text-anchor="middle">harish@backend-node-01: ~/about (zsh)</text>

  <!-- Command -->
  <g transform="translate(30, 62)">
    <text x="0" y="0" class="t-user">harish</text>
    <text x="50" y="0" class="t-prompt">@platform-eng</text>
    <text x="160" y="0" class="t-path">:~/about$</text>
    <text x="240" y="0" class="t-cmd">cat profile.json</text>
  </g>

  <!-- JSON Output Block -->
  <g transform="translate(45, 88)">
    <text x="0" y="0" class="j-brace">{</text>
    <text x="20" y="22" class="j-key">"developer"</text><text x="120" y="22" class="j-brace">:</text> <text x="135" y="22" class="j-str">"Harish"</text><text x="205" y="22" class="j-brace">,</text>
    <text x="20" y="42" class="j-key">"degree"</text><text x="120" y="42" class="j-brace">:</text> <text x="135" y="42" class="j-str">"3rd Year ECE Undergrad ('26)"</text><text x="390" y="42" class="j-brace">,</text>
    <text x="20" y="62" class="j-key">"domain"</text><text x="120" y="62" class="j-brace">:</text> <text x="135" y="62" class="j-str">"Java Backend &amp; Platform Engineering"</text><text x="460" y="62" class="j-brace">,</text>
    <text x="20" y="82" class="j-key">"architecture"</text><text x="145" y="82" class="j-brace">:</text> <text x="160" y="82" class="j-brace">[</text><text x="170" y="82" class="j-arr">"Microservices"</text><text x="295" y="82" class="j-brace">,</text> <text x="310" y="82" class="j-arr">"Kafka / Redis"</text><text x="435" y="82" class="j-brace">,</text> <text x="450" y="82" class="j-arr">"Spring AI / RAG"</text><text x="590" y="82" class="j-brace">],</text>
    <text x="20" y="102" class="j-key">"core_tenets"</text><text x="145" y="102" class="j-brace">:</text> <text x="160" y="102" class="j-str">"Clean Architecture • High Throughput • Low Latency • Fault Tolerance"</text><text x="735" y="102" class="j-brace">,</text>
    <text x="20" y="122" class="j-key">"target_roles"</text><text x="145" y="122" class="j-brace">:</text> <text x="160" y="122" class="j-str">"Java Backend / Systems / Platform Engineer Internships &amp; Full-Time"</text>
    <text x="0" y="146" class="j-brace">}</text>
  </g>
</svg>
