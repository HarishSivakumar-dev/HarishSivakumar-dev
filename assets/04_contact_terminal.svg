<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #1e1e1e; }
      .header-bg { fill: #2d2d2d; }
      .title-text { fill: #b5b5b5; font-family: '-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; }
      .cmd-text { fill: #d4d4d4; font-family: 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 13.5px; line-height: 1.45; }
      .prompt { fill: #35d499; font-weight: bold; }
      .path { fill: #569cd6; font-weight: bold; }
      .cyan { fill: #4fc1ff; }
      .green { fill: #4ec9b0; }
      .yellow { fill: #ce9178; }
      .comment { fill: #6a9955; }
      .cursor { fill: #aeafad; }
    </style>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="840" height="350" rx="10" ry="10" class="header-bg" filter="url(#shadow4)" stroke="#3c3c3c" stroke-width="1" />
  <rect x="5" y="5" width="840" height="38" rx="10" ry="10" class="header-bg" />
  <line x1="5" y1="43" x2="845" y2="43" stroke="#252526" stroke-width="1" />

  <circle cx="24" cy="24" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="44" cy="24" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="64" cy="24" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <text x="425" y="28" text-anchor="middle" class="title-text">harish — curl api.harish.dev — 80×18</text>

  <rect x="5" y="44" width="840" height="310" rx="0" ry="0" class="bg" />

  <g transform="translate(24, 72)" class="cmd-text">
    <text x="0" y="0"><tspan class="prompt">harish@macbook-pro</tspan> <tspan class="path">~</tspan> % curl -s GET "https://api.harish.dev/v1/contact"</text>
    
    <text x="0" y="25" class="comment">{</text>
    <text x="20" y="45"><tspan class="cyan">"developer"</tspan>: <tspan class="yellow">"Harish Sivakumar"</tspan>,</text>
    <text x="20" y="65"><tspan class="cyan">"github"</tspan>: <tspan class="yellow">"https://github.com/HarishSivakumar-Dev"</tspan>,</text>
    <text x="20" y="85"><tspan class="cyan">"linkedin"</tspan>: <tspan class="yellow">"https://linkedin.com/in/YOUR_LINKEDIN"</tspan>,</text>
    <text x="20" y="105"><tspan class="cyan">"email"</tspan>: <tspan class="yellow">"your.email@domain.com"</tspan>,</text>
    <text x="20" y="125"><tspan class="cyan">"availability"</tspan>: <tspan class="yellow">"Open for Backend &amp; Distributed Systems Engineering"</tspan>,</text>
    <text x="20" y="145"><tspan class="cyan">"http_status"</tspan>: <tspan class="green">"200 OK"</tspan></text>
    <text x="0" y="165" class="comment">}</text>

    <text x="0" y="205" class="comment">================================================================================</text>
    <text x="0" y="225"><tspan class="cyan">SESSION COMPLETED :</tspan> Process exited with status 0</text>
    <text x="0" y="245" class="comment">================================================================================</text>

    <text x="0" y="280"><tspan class="prompt">harish@macbook-pro</tspan> <tspan class="path">~</tspan> % <tspan class="cursor">█</tspan></text>
  </g>
</svg>
