<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #0c0c0c; }
      .header-bg { fill: #1f1f1f; }
      .title-text { fill: #cccccc; font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; }
      .cmd-text { fill: #cccccc; font-family: 'Consolas', 'Cascadia Code', monospace; font-size: 13.5px; line-height: 1.45; }
      .prompt { fill: #ffffff; font-weight: bold; }
      .cyan { fill: #38daf0; }
      .green { fill: #4caf50; }
      .yellow { fill: #e5c07b; }
      .comment { fill: #5c6370; }
      .cursor { fill: #cccccc; }
    </style>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="840" height="350" rx="8" ry="8" class="header-bg" filter="url(#shadow4)" stroke="#333333" stroke-width="1" />
  <rect x="5" y="5" width="840" height="36" rx="8" ry="8" class="header-bg" />
  <line x1="5" y1="41" x2="845" y2="41" stroke="#2b2b2b" stroke-width="1" />

  <g transform="translate(20, 15)">
    <rect x="0" y="0" width="14" height="14" fill="#000000" rx="2" stroke="#666" stroke-width="1"/>
    <text x="2" y="10" fill="#ffffff" font-family="Consolas" font-size="10" font-weight="bold">&gt;_</text>
  </g>
  <text x="44" y="27" class="title-text">Command Prompt - curl.exe -s https://api.harish.dev/v1/contact</text>

  <g transform="translate(740, 10)">
    <line x1="10" y1="14" x2="20" y2="14" stroke="#cccccc" stroke-width="1" />
    <rect x="42" y="7" width="10" height="10" stroke="#cccccc" stroke-width="1" fill="transparent" />
    <line x1="75" y1="7" x2="87" y2="17" stroke="#cccccc" stroke-width="1.2" />
    <line x1="87" y1="7" x2="75" y2="17" stroke="#cccccc" stroke-width="1.2" />
  </g>

  <rect x="5" y="42" width="840" height="312" class="bg" />

  <g transform="translate(20, 70)" class="cmd-text">
    <text x="0" y="0"><tspan class="prompt">C:\Users\HarishSivakumar&gt;</tspan> curl.exe -s -X GET "https://api.harish.dev/v1/contact"</text>
    
    <text x="0" y="30" class="comment">{</text>
    <text x="20" y="50"><tspan class="cyan">"developer"</tspan>: <tspan class="yellow">"Harish Sivakumar"</tspan>,</text>
    <text x="20" y="70"><tspan class="cyan">"github"</tspan>: <tspan class="yellow">"https://github.com/HarishSivakumar-Dev"</tspan>,</text>
    <text x="20" y="90"><tspan class="cyan">"linkedin"</tspan>: <tspan class="yellow">"https://linkedin.com/in/YOUR_LINKEDIN"</tspan>,</text>
    <text x="20" y="110"><tspan class="cyan">"email"</tspan>: <tspan class="yellow">"your.email@domain.com"</tspan>,</text>
    <text x="20" y="130"><tspan class="cyan">"availability"</tspan>: <tspan class="yellow">"Open for Backend &amp; Distributed Systems Engineering"</tspan>,</text>
    <text x="20" y="150"><tspan class="cyan">"http_status"</tspan>: <tspan class="green">"200 OK"</tspan></text>
    <text x="0" y="170" class="comment">}</text>

    <text x="0" y="210" class="comment">================================================================================</text>
    <text x="0" y="230"><tspan class="prompt">SESSION COMPLETED :</tspan> Exit code 0 (Success)</text>
    <text x="0" y="250" class="comment">================================================================================</text>

    <text x="0" y="285"><tspan class="prompt">C:\Users\HarishSivakumar&gt;</tspan> <tspan class="cursor">█</tspan></text>
  </g>
</svg>
