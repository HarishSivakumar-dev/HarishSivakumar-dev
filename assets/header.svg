<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" style="background:transparent; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="pixel-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="200" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>
  <rect width="850" height="200" rx="12" fill="url(#pixel-grid)" />

  <!-- Top Decorative Green Accent Bar -->
  <rect x="0" y="0" width="850" height="4" rx="2" fill="url(#text-grad)"/>

  <!-- Matrix / Pixel Art Pattern Graphic (Right Side) -->
  <g transform="translate(620, 25)">
    <!-- Pixel Matrix Block Grid -->
    <rect x="0" y="0" width="16" height="16" fill="#2ea043" opacity="0.9" rx="2"/>
    <rect x="20" y="0" width="16" height="16" fill="#238636" opacity="0.5" rx="2"/>
    <rect x="40" y="0" width="16" height="16" fill="#3fb950" opacity="0.8" rx="2"/>
    <rect x="60" y="0" width="16" height="16" fill="#30363d" opacity="0.4" rx="2"/>
    <rect x="80" y="0" width="16" height="16" fill="#2ea043" opacity="0.7" rx="2"/>
    <rect x="100" y="0" width="16" height="16" fill="#238636" opacity="0.9" rx="2"/>
    <rect x="120" y="0" width="16" height="16" fill="#56d364" opacity="0.8" rx="2"/>
    <rect x="140" y="0" width="16" height="16" fill="#30363d" opacity="0.3" rx="2"/>

    <rect x="0" y="20" width="16" height="16" fill="#30363d" opacity="0.3" rx="2"/>
    <rect x="20" y="20" width="16" height="16" fill="#56d364" opacity="0.9" rx="2"/>
    <rect x="40" y="20" width="16" height="16" fill="#238636" opacity="0.6" rx="2"/>
    <rect x="60" y="20" width="16" height="16" fill="#2ea043" opacity="0.95" rx="2"/>
    <rect x="80" y="20" width="16" height="16" fill="#30363d" opacity="0.5" rx="2"/>
    <rect x="100" y="20" width="16" height="16" fill="#3fb950" opacity="0.85" rx="2"/>
    <rect x="120" y="20" width="16" height="16" fill="#238636" opacity="0.4" rx="2"/>
    <rect x="140" y="20" width="16" height="16" fill="#2ea043" opacity="0.9" rx="2"/>

    <rect x="0" y="40" width="16" height="16" fill="#2ea043" opacity="0.7" rx="2"/>
    <rect x="20" y="40" width="16" height="16" fill="#30363d" opacity="0.4" rx="2"/>
    <rect x="40" y="40" width="16" height="16" fill="#56d364" opacity="0.85" rx="2"/>
    <rect x="60" y="40" width="16" height="16" fill="#238636" opacity="0.9" rx="2"/>
    <rect x="80" y="40" width="16" height="16" fill="#3fb950" opacity="0.75" rx="2"/>
    <rect x="100" y="40" width="16" height="16" fill="#30363d" opacity="0.3" rx="2"/>
    <rect x="120" y="40" width="16" height="16" fill="#2ea043" opacity="0.95" rx="2"/>
    <rect x="140" y="40" width="16" height="16" fill="#56d364" opacity="0.6" rx="2"/>

    <rect x="0" y="60" width="16" height="16" fill="#3fb950" opacity="0.6" rx="2"/>
    <rect x="20" y="60" width="16" height="16" fill="#2ea043" opacity="0.9" rx="2"/>
    <rect x="40" y="60" width="16" height="16" fill="#30363d" opacity="0.5" rx="2"/>
    <rect x="60" y="60" width="16" height="16" fill="#56d364" opacity="0.7" rx="2"/>
    <rect x="80" y="60" width="16" height="16" fill="#238636" opacity="0.8" rx="2"/>
    <rect x="100" y="60" width="16" height="16" fill="#2ea043" opacity="0.9" rx="2"/>
    <rect x="120" y="60" width="16" height="16" fill="#30363d" opacity="0.4" rx="2"/>
    <rect x="140" y="60" width="16" height="16" fill="#3fb950" opacity="0.8" rx="2"/>

    <rect x="0" y="80" width="16" height="16" fill="#238636" opacity="0.8" rx="2"/>
    <rect x="20" y="80" width="16" height="16" fill="#30363d" opacity="0.3" rx="2"/>
    <rect x="40" y="80" width="16" height="16" fill="#2ea043" opacity="0.9" rx="2"/>
    <rect x="60" y="80" width="16" height="16" fill="#3fb950" opacity="0.6" rx="2"/>
    <rect x="80" y="80" width="16" height="16" fill="#30363d" opacity="0.5" rx="2"/>
    <rect x="100" y="80" width="16" height="16" fill="#56d364" opacity="0.85" rx="2"/>
    <rect x="120" y="80" width="16" height="16" fill="#2ea043" opacity="0.7" rx="2"/>
    <rect x="140" y="80" width="16" height="16" fill="#238636" opacity="0.9" rx="2"/>
