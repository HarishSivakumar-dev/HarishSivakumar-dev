  <!-- Left Content Block -->
  <!-- Monospace Terminal Tag -->
  <rect x="40" y="32" width="160" height="24" rx="6" fill="#1f242c" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="48" font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#3fb950" font-weight="600">❯ SYSTEM.INIT()</text>

  <!-- Main Name Title -->
  <text x="40" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="34" fill="#ffffff" font-weight="800" letter-spacing="1.5">HARISH SIVAKUMAR</text>

  <!-- Role Subtitle -->
  <text x="40" y="128" font-family="'Consolas', 'Courier New', monospace" font-size="14" fill="#3fb950" font-weight="700" letter-spacing="1.2">JAVA BACKEND &amp; PLATFORM ENGINEER</text>

  <!-- Focus Tags -->
  <text x="40" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#8b949e" font-weight="500">
    Microservices Architectures • Distributed Systems • Spring Boot • Cloud &amp; AI / RAG
  </text>
  
  <text x="620" y="158" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#484f58" text-anchor="start">ECE '26 | JAVA / SPRING</text>
