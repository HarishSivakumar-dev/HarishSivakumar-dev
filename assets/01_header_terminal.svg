<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #0c0c0c; }
      .header-bg { fill: #1f1f1f; }
      .title-text { fill: #cccccc; font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; }
      .cmd-text { fill: #cccccc; font-family: 'Consolas', 'Cascadia Code', monospace; font-size: 14px; line-height: 1.5; }
      .prompt { fill: #ffffff; font-weight: bold; }
      .cyan { fill: #38daf0; }
      .green { fill: #4caf50; }
      .yellow { fill: #e5c07b; }
      .comment { fill: #767676; }
      .cursor { fill: #cccccc; }
    </style>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="840" height="410" rx="8" ry="8" class="header-bg" filter="url(#shadow1)" stroke="#333333" stroke-width="1" />
  <rect x="5" y="5" width="840" height="36" rx="8" ry="8" class="header-bg" />
  <line x1="5" y1="41" x2="845" y2="41" stroke="#2b2b2b" stroke-width="1" />

  <!-- Window Icon -->
  <g transform="translate(20, 15)">
    <rect x="0" y="0" width="14" height="14" fill="#000000" rx="2" stroke="#666" stroke-width="1"/>
    <text x="2" y="10" fill="#ffffff" font-family="Consolas" font-size="10" font-weight="bold">&gt;_</text>
  </g>
  <text x="44" y="27" class="title-text">Command Prompt - System Overview | Harish Sivakumar</text>

  <!-- Controls -->
  <g transform="translate(740, 10)">
    <line x1="10" y1="14" x2="20" y2="14" stroke="#cccccc" stroke-width="1" />
    <rect x="42" y="7" width="10" height="10" stroke="#cccccc" stroke-width="1" fill="transparent" />
    <line x1="75" y1="7" x2="87" y2="17" stroke="#cccccc" stroke-width="1.2" />
    <line x1="87" y1="7" x2="75" y2="17" stroke="#cccccc" stroke-width="1.2" />
  </g>

  <rect x="5" y="42" width="840" height="372" class="bg" />

  <g transform="translate(20, 70)" class="cmd-text">
    <text x="0" y="0">Microsoft Windows [Version 10.0.22631.4169]</text>
    <text x="0" y="20">(c) Microsoft Corporation. All rights reserved.</text>

    <text x="0" y="60"><tspan class="prompt">C:\Users\HarishSivakumar&gt;</tspan> whoami /all</text>
    
    <text x="0" y="90" class="comment">================================================================================</text>
    <text x="0" y="110"><tspan class="prompt">USER      :</tspan> Harish Sivakumar</text>
    <text x="0" y="130"><tspan class="prompt">ROLE      :</tspan> Backend Systems Developer</text>
    <text x="0" y="150"><tspan class="prompt">SPECIALTY :</tspan> Microservices | Distributed Systems | Event-Driven &amp; RAG</text>
    <text x="0" y="170"><tspan class="prompt">STATUS    :</tspan> <tspan class="green">OPERATIONAL (200 OK)</tspan></text>
    <text x="0" y="190" class="comment">================================================================================</text>

    <text x="0" y="230"><tspan class="prompt">C:\Users\HarishSivakumar&gt;</tspan> type %USERPROFILE%\system_spec.yaml</text>
    <text x="0" y="260"><tspan class="yellow">OS         :</tspan> Windows / Linux</text>
    <text x="0" y="280"><tspan class="yellow">Runtime    :</tspan> Java (17+) / Spring Boot 3.x</text>
    <text x="0" y="300"><tspan class="yellow">Services   :</tspan> Microservices, Event Streaming (Kafka), RAG Pipelines</text>
    <text x="0" y="320"><tspan class="yellow">Databases  :</tspan> PostgreSQL (pgvector), MySQL, Redis</text>
    <text x="0" y="340"><tspan class="yellow">Infra      :</tspan> Docker, AWS EC2, Nginx</text>

    <text x="0" y="375"><tspan class="prompt">C:\Users\HarishSivakumar&gt;</tspan> <tspan class="cursor">█</tspan></text>
  </g>
</svg>
