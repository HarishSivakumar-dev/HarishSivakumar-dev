<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #1e1e1e; }
      .header-bg { fill: #2d2d2d; }
      .title-text { fill: #b5b5b5; font-family: '-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; }
      .cmd-text { fill: #d4d4d4; font-family: 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 13.5px; line-height: 1.5; }
      .prompt { fill: #35d499; font-weight: bold; }
      .path { fill: #569cd6; font-weight: bold; }
      .cyan { fill: #4fc1ff; }
      .green { fill: #4ec9b0; }
      .yellow { fill: #ce9178; }
      .comment { fill: #6a9955; }
      .cursor { fill: #aeafad; }
    </style>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="5" y="5" width="840" height="410" rx="10" ry="10" class="header-bg" filter="url(#shadow1)" stroke="#3c3c3c" stroke-width="1" />
  <rect x="5" y="5" width="840" height="38" rx="10" ry="10" class="header-bg" />
  <line x1="5" y1="43" x2="845" y2="43" stroke="#252526" stroke-width="1" />

  <!-- macOS Traffic Light Buttons -->
  <circle cx="24" cy="24" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="44" cy="24" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="64" cy="24" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Centered Window Title -->
  <text x="425" y="28" text-anchor="middle" class="title-text">harish — -zsh — 80×24</text>

  <!-- Terminal Canvas -->
  <rect x="5" y="44" width="840" height="370" rx="0" ry="0" class="bg" />

  <g transform="translate(24, 72)" class="cmd-text">
    <text x="0" y="0"><tspan class="prompt">harish@macbook-pro</tspan> <tspan class="path">~</tspan> % sw_vers &amp;&amp; whoami</text>
    
    <text x="0" y="25" class="comment">================================================================================</text>
    <text x="0" y="45">ProductName: macOS Sequoia (Darwin 24.0.0)</text>
    <text x="0" y="65"><tspan class="cyan">USER      :</tspan> Harish Sivakumar</text>
    <text x="0" y="85"><tspan class="cyan">ROLE      :</tspan> Backend Developer</text>
    <text x="0" y="105"><tspan class="cyan">SPECIALTY :</tspan> Microservices | Distributed Systems | Event-Driven &amp; RAG</text>
    <text x="0" y="125"><tspan class="cyan">STATUS    :</tspan> <tspan class="green">OPERATIONAL (200 OK)</tspan></text>
    <text x="0" y="145" class="comment">================================================================================</text>

    <text x="0" y="185"><tspan class="prompt">harish@macbook-pro</tspan> <tspan class="path">~</tspan> % cat ~/.config/system_spec.yaml</text>
    <text x="0" y="215"><tspan class="yellow">OS         :</tspan> macOS / Linux</text>
    <text x="0" y="235"><tspan class="yellow">Runtime    :</tspan> Java (17+) / Spring Boot 3.x</text>
    <text x="0" y="255"><tspan class="yellow">Services   :</tspan> Microservices, Event Streaming (Kafka), RAG Pipelines</text>
    <text x="0" y="275"><tspan class="yellow">Databases  :</tspan> PostgreSQL (pgvector), MySQL, Redis</text>
    <text x="0" y="295"><tspan class="yellow">Infra      :</tspan> Docker, AWS EC2, Nginx</text>

    <text x="0" y="335"><tspan class="prompt">harish@macbook-pro</tspan> <tspan class="path">~</tspan> % <tspan class="cursor">█</tspan></text>
  </g>
</svg>
