<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="310" style="background:transparent;">
  <defs>
    <style>
      @keyframes fill-92 { 0% { width: 0px; } 100% { width: 230px; } }
      @keyframes fill-88 { 0% { width: 0px; } 100% { width: 220px; } }
      @keyframes fill-82 { 0% { width: 0px; } 100% { width: 205px; } }
      @keyframes fill-78 { 0% { width: 0px; } 100% { width: 195px; } }

      .t-title { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #8b949e; }
      .t-prompt { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: bold; fill: #3fb950; }
      .t-user { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: bold; fill: #58a6ff; }
      .t-path { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: bold; fill: #d2a8ff; }
      .t-cmd { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #f0f6fc; }
      
      .s-label { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #c9d1d9; }
      .s-percent { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #3fb950; }
      .s-tag { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #79c0ff; }
      
      .bar-bg { fill: #21262d; rx: 3px; }
      .bar-fill-92 { fill: #3fb950; rx: 3px; animation: fill-92 1.5s ease-out forwards; }
      .bar-fill-88 { fill: #2ea043; rx: 3px; animation: fill-88 1.5s ease-out forwards; }
      .bar-fill-82 { fill: #3fb950; rx: 3px; animation: fill-82 1.5s ease-out forwards; }
      .bar-fill-78 { fill: #2ea043; rx: 3px; animation: fill-78 1.5s ease-out forwards; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="310" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 842,0 A 8,8 0 0,1 850,8 L 850,36 L 0,36 Z" fill="#161b22"/>
  <line x1="0" y1="36" x2="850" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="425" y="22" class="t-title" text-anchor="middle">harish@backend-node-01: ~/skills (zsh)</text>

  <!-- Command Line -->
  <g transform="translate(30, 62)">
    <text x="0" y="0" class="t-user">harish</text>
    <text x="50" y="0" class="t-prompt">@platform-eng</text>
    <text x="160" y="0" class="t-path">:~/skills$</text>
    <text x="250" y="0" class="t-cmd">./render_stack_diagnostics.sh</text>
  </g>

  <!-- Diagnostic Skill Progress Bars -->
  <g transform="translate(45, 95)">
    <!-- Skill 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="12" class="s-label">Java &amp; Spring Boot 3</text>
      <rect x="250" y="2" width="250" height="13" class="bar-bg"/>
      <rect x="250" y="2" width="230" height="13" class="bar-fill-92"/>
      <text x="515" y="12" class="s-percent">92%</text>
      <text x="565" y="12" class="s-tag">[ACTIVE / CORE]</text>
    </g>

    <!-- Skill 2 -->
    <g transform="translate(0, 28)">
      <text x="0" y="12" class="s-label">Microservices Architecture</text>
      <rect x="250" y="2" width="250" height="13" class="bar-bg"/>
      <rect x="250" y="2" width="220" height="13" class="bar-fill-88"/>
      <text x="515" y="12" class="s-percent">88%</text>
      <text x="565" y="12" class="s-tag">[ONLINE / EUREKA]</text>
    </g>

    <!-- Skill 3 -->
    <g transform="translate(0, 56)">
      <text x="0" y="12" class="s-label">PostgreSQL / MySQL / Redis</text>
      <rect x="250" y="2" width="250" height="13" class="bar-bg"/>
      <rect x="250" y="2" width="220" height="13" class="bar-fill-88"/>
      <text x="515" y="12" class="s-percent">88%</text>
      <text x="565" y="12" class="s-tag">[ONLINE / CACHE]</text>
    </g>

    <!-- Skill 4 -->
    <g transform="translate(0, 84)">
      <text x="0" y="12" class="s-label">Kafka &amp; Event Streaming</text>
      <rect x="250" y="2" width="250" height="13" class="bar-bg"/>
      <rect x="250" y="2" width="205" height="13" class="bar-fill-82"/>
      <text x="515" y="12" class="s-percent">82%</text>
      <text x="565" y="12" class="s-tag">[ONLINE / QUEUE]</text>
    </g>

    <!-- Skill 5 -->
    <g transform="translate(0, 112)">
      <text x="0" y="12" class="s-label">Docker &amp; AWS EC2 / Nginx</text>
      <rect x="250" y="2" width="250" height="13" class="bar-bg"/>
      <rect x="250" y="2" width="195" height="13" class="bar-fill-78"/>
      <text x="515" y="12" class="s-percent">78%</text>
      <text x="565" y="12" class="s-tag">[ONLINE / DEPLOY]</text>
    </g>

    <!-- Skill 6 -->
    <g transform="translate(0, 140)">
      <text x="0" y="12" class="s-label">DSA &amp; Algorithmic Thinking</text>
      <rect x="250" y="2" width="250" height="13" class="bar-bg"/>
      <rect x="250" y="2" width="220" height="13" class="bar-fill-88"/>
      <text x="515" y="12" class="s-percent">88%</text>
      <text x="565" y="12" class="s-tag">[OPTIMAL / TREES]</text>
    </g>

    <!-- Skill 7 -->
    <g transform="translate(0, 168)">
      <text x="0" y="12" class="s-label">Spring AI &amp; pgvector RAG</text>
      <rect x="250" y="2" width="250" height="13" class="bar-bg"/>
      <rect x="250" y="2" width="205" height="13" class="bar-fill-82"/>
      <text x="515" y="12" class="s-percent">82%</text>
      <text x="565" y="12" class="s-tag">[ONLINE / LLM]</text>
    </g>
  </g>
</svg>
