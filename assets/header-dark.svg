<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-label="Harish Sivakumar. Backend developer building event-driven systems. Events flow from producers through a log to consumers.">
<style>
  .name { font: 700 44px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #E6EDF3; letter-spacing: -0.5px; }
  .tag { font: 400 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8B949E; }
  .label { font: 400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8B949E; }
  .packet { opacity: 0; animation: travel 3s linear infinite; }
  @keyframes travel {
    0% { offset-distance: 0%; opacity: 0; }
    6% { opacity: 1; }
    30% { offset-distance: 100%; opacity: 1; }
    33%, 100% { offset-distance: 100%; opacity: 0; }
  }
  .cell { fill: #161B22; animation: commit 9s linear infinite; }
  @keyframes commit {
    0%, 2% { fill: #161B22; }
    4%, 12% { fill: #2DD4BF; }
    22%, 100% { fill: #161B22; }
  }
  
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .packet { display: none; }
}
</style>
