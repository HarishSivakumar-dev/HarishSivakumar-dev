<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #0c0c0c; }
      .header-bg { fill: #1f1f1f; }
      .title-text { fill: #cccccc; font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 400; }
      .cmd-text { fill: #cccccc; font-family: 'Consolas', 'Cascadia Code', monospace; font-size: 13.5px; line-height: 1.45; }
      .prompt { fill: #ffffff; font-weight: bold; }
      .cyan { fill: #38daf0; }
      .green { fill: #4caf50; }
      .yellow { fill: #e5c07b; }
      .comment { fill: #5c6370; }
      .cursor { fill: #cccccc; }
    </style>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="840" height="510" rx="8" ry="8" class="header-bg" filter="url(#shadow3)" stroke="#333333" stroke-width="1" />
  <rect x="5" y="5" width="840" height="36" rx="8" ry="8" class="header-bg" />
  <line x1="5" y1="41" x2="845" y2="41" stroke="#2b2b2b" stroke-width="1" />

  <g transform="translate(20, 15)">
    <rect x="0" y="0" width="14" height="14" fill="#000000" rx="2" stroke="#666" stroke-width="1"/>
    <text x="2" y="10" fill="#ffffff" font-family="Consolas" font-size="10" font-weight="bold">&gt;_</text>
  </g>
  <text x="44" y="27" class="title-text">Command Prompt - tasklist &amp; cs_core.json</text>

  <g transform="translate(740, 10)">
    <line x1="10" y1="14" x2="20" y2="14" stroke="#cccccc" stroke-width="1" />
    <rect x="42" y="7" width="10" height="10" stroke="#cccccc" stroke-width="1" fill="transparent" />
    <line x1="75" y1="7" x2="87" y2="17" stroke="#cccccc" stroke-width="1.2" />
    <line x1="87" y1="7" x2="75" y2="17" stroke="#cccccc" stroke-width="1.2" />
  </g>

  <rect x="5" y="42" width="840" height="472" class="bg" />

  <g transform="translate(20, 70)" class="cmd-text">
    <!-- CS Core Command -->
    <text x="0" y="0"><tspan class="prompt">C:\Users\HarishSivakumar&gt;</tspan> type %USERPROFILE%\cs_core.json</text>
    
    <text x="0" y="30" class="comment">{</text>
    <text x="20" y="50"><tspan class="cyan">"domain"</tspan>: <tspan class="yellow">"Data Structures &amp; Algorithms (DSA)"</tspan>,</text>
    <text x="20" y="70"><tspan class="cyan">"data_structures"</tspan>: [<tspan class="yellow">"Trees"</tspan>, <tspan class="yellow">"Graphs"</tspan>, <tspan class="yellow">"Hash Tables / Maps"</tspan>],</text>
    <text x="20" y="90"><tspan class="cyan">"algorithmic_patterns"</tspan>: [<tspan class="yellow">"DFS / BFS"</tspan>, <tspan class="yellow">"Sliding Window"</tspan>, <tspan class="yellow">"Recursion &amp; Backtracking"</tspan>]</text>
    <text x="0" y="110" class="comment">}</text>

    <!-- Tasklist Command -->
    <text x="0" y="150"><tspan class="prompt">C:\Users\HarishSivakumar&gt;</tspan> tasklist /FI "STATUS eq RUNNING" /FO TABLE</text>

    <text x="0" y="180" class="comment">Image Name                   PID Session Name        Mem Usage  Service Description</text>
    <text x="0" y="195" class="comment">======================== ======== ================ ============ ===================================</text>
    <text x="0" y="215">java.exe                    10420 Console             412,852 K  Spring Boot / Microservices Core</text>
    <text x="0" y="235">kafka_server.exe             8912 Console             310,120 K  Apache Kafka Event Broker</text>
    <text x="0" y="255">redis-server.exe             4508 Console              48,200 K  Redis In-Memory Cache</text>
    <text x="0" y="275">postgres.exe                 6124 Console             185,400 K  PostgreSQL + pgvector Engine</text>
    <text x="0" y="295">docker.exe                  12048 Console             890,110 K  Docker Desktop Container Runtime</text>

    <text x="0" y="340" class="comment">================================================================================</text>
    <text x="0" y="360"><tspan class="prompt">SYSTEM STATUS :</tspan> <tspan class="green">ALL 5 MICROSERVICES ACTIVE &amp; HEALTHY</tspan></text>
    <text x="0" y="380" class="comment">================================================================================</text>

    <text x="0" y="420"><tspan class="prompt">C:\Users\HarishSivakumar&gt;</tspan> <tspan class="cursor">█</tspan></text>
  </g>
</svg>
