<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #1e1e1e; }
      .header-bg { fill: #2d2d2d; }
      .title-text { fill: #b5b5b5; font-family: '-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; }
      .cmd-text { fill: #d4d4d4; font-family: 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 13.5px; line-height: 1.45; }
      .prompt { fill: #35d499; font-weight: bold; }
      .path { fill: #569cd6; font-weight: bold; }
      .cyan { fill: #4fc1ff; }
      .green { fill: #4ec9b0; }
      .yellow { fill: #ce9178; }
      .comment { fill: #6a9955; }
      .cursor { fill: #aeafad; }
    </style>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="840" height="510" rx="10" ry="10" class="header-bg" filter="url(#shadow3)" stroke="#3c3c3c" stroke-width="1" />
  <rect x="5" y="5" width="840" height="38" rx="10" ry="10" class="header-bg" />
  <line x1="5" y1="43" x2="845" y2="43" stroke="#252526" stroke-width="1" />

  <circle cx="24" cy="24" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="44" cy="24" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="64" cy="24" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <text x="425" y="28" text-anchor="middle" class="title-text">harish — ps aux | grep backend — 80×26</text>

  <rect x="5" y="44" width="840" height="470" rx="0" ry="0" class="bg" />

  <g transform="translate(24, 72)" class="cmd-text">
    <text x="0" y="0"><tspan class="prompt">harish@macbook-pro</tspan> <tspan class="path">~</tspan> % cat ~/.config/cs_core.json</text>
    
    <text x="0" y="25" class="comment">{</text>
    <text x="20" y="45"><tspan class="cyan">"domain"</tspan>: <tspan class="yellow">"Data Structures &amp; Algorithms (DSA)"</tspan>,</text>
    <text x="20" y="65"><tspan class="cyan">"data_structures"</tspan>: [<tspan class="yellow">"Trees"</tspan>, <tspan class="yellow">"Graphs"</tspan>, <tspan class="yellow">"Hash Tables / Maps"</tspan>],</text>
    <text x="20" y="85"><tspan class="cyan">"algorithmic_patterns"</tspan>: [<tspan class="yellow">"DFS / BFS"</tspan>, <tspan class="yellow">"Sliding Window"</tspan>, <tspan class="yellow">"Recursion &amp; Backtracking"</tspan>]</text>
    <text x="0" y="105" class="comment">}</text>

    <!-- macOS Process Listing -->
    <text x="0" y="145"><tspan class="prompt">harish@macbook-pro</tspan> <tspan class="path">~</tspan> % ps aux | grep -E "java|kafka|redis|postgres|docker"</text>

    <text x="0" y="175" class="comment">USER       PID  %CPU %MEM      VSZ    RSS   TT  STAT STARTED      TIME COMMAND</text>
    <text x="0" y="190" class="comment">====================================================================================</text>
    <text x="0" y="210">harish   10420   2.4  3.8  4120852 412852   ??  S    10:14AM   0:42.12 java (Spring Boot Core)</text>
    <text x="0" y="230">harish    8912   1.2  2.5  3100120 310120   ??  S    10:14AM   0:18.45 kafka-server (Apache Kafka)</text>
    <text x="0" y="250">harish    4508   0.3  0.5   480200  48200   ??  S    10:14AM   0:04.10 redis-server *:6379</text>
    <text x="0" y="270">harish    6124   0.8  1.5  1850400 185400   ??  S    10:14AM   0:12.30 postgres (pgvector engine)</text>
    <text x="0" y="290">harish   12048   1.5  2.8  8900110 890110   ??  S    10:14AM   0:25.80 com.docker.backend</text>

    <text x="0" y="335" class="comment">====================================================================================</text>
    <text x="0" y="355"><tspan class="cyan">SYSTEM STATUS :</tspan> <tspan class="green">ALL 5 MICROSERVICES HEALTHY &amp; ACTIVE</tspan></text>
    <text x="0" y="375" class="comment">====================================================================================</text>

    <text x="0" y="415"><tspan class="prompt">harish@macbook-pro</tspan> <tspan class="path">~</tspan> % <tspan class="cursor">█</tspan></text>
  </g>
</svg>
