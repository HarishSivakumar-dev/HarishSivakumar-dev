<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160" style="background:transparent;">
  <defs>
    <style>
      .t-title { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #8b949e; }
      .t-prompt { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: bold; fill: #3fb950; }
      .t-user { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: bold; fill: #58a6ff; }
      .t-path { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: bold; fill: #d2a8ff; }
      .t-cmd { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #f0f6fc; }
      .t-sub { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #8b949e; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="160" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 842,0 A 8,8 0 0,1 850,8 L 850,36 L 0,36 Z" fill="#161b22"/>
  <line x1="0" y1="36" x2="850" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="425" y="22" class="t-title" text-anchor="middle">harish@backend-node-01: ~/connect (zsh)</text>

  <!-- Command Line -->
  <g transform="translate(30, 62)">
    <text x="0" y="0" class="t-user">harish</text>
    <text x="50" y="0" class="t-prompt">@platform-eng</text>
    <text x="160" y="0" class="t-path">:~/connect$</text>
    <text x="250" y="0" class="t-cmd">./establish_connection.sh --open-channel</text>
  </g>

  <!-- Sub-text -->
  <g transform="translate(30, 92)">
    <text x="0" y="0" class="t-sub">❯ Open for Java Backend Engineering Internships &amp; Full-Time Opportunities. Select a channel:</text>
  </g>

  <!-- Social Link Badges inside Terminal -->
  <g transform="translate(30, 110)">
    <a href="https://linkedin.com/in/">
      <rect x="0" y="0" width="130" height="32" rx="4" fill="#0A66C2"/>
      <text x="65" y="21" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">LinkedIn</text>
    </a>

    <a href="https://github.com/HarishSivakumar-dev">
      <rect x="145" y="0" width="130" height="32" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="210" y="21" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GitHub</text>
    </a>

    <a href="mailto:harishsivakumar.dev@gmail.com">
      <rect x="290" y="0" width="140" height="32" rx="4" fill="#EA4335"/>
      <text x="360" y="21" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Email Session</text>
    </a>

    <a href="#">
      <rect x="445" y="0" width="130" height="32" rx="4" fill="#FFA116"/>
      <text x="510" y="21" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">LeetCode</text>
    </a>

    <a href="#">
      <rect x="590" y="0" width="130" height="32" rx="4" fill="#D97706"/>
      <text x="655" y="21" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Portfolio Web</text>
    </a>
  </g>
</svg>
