<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" style="background:transparent;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <style>
      @keyframes pulse-line { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
      @keyframes float-node { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      .bg-grid { stroke: #21262d; stroke-width: 1; opacity: 0.4; }
      .brand-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 52px; font-weight: 900; fill: #ffffff; letter-spacing: 3px; }
      .brand-subtitle { font-family: 'Consolas', 'Fira Code', monospace; font-size: 22px; font-weight: 700; fill: #3fb950; letter-spacing: 2px; }
      .brand-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #8b949e; }
      .badge-tag { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #58a6ff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- Subtle Grid Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Accent Top Border Glow -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-grad)"/>

  <!-- Branding Text Block -->
  <g transform="translate(60, 110)">
    <text x="0" y="0" class="brand-title">HARISH SIVAKUMAR</text>
    <text x="0" y="42" class="brand-subtitle">❯ JAVA BACKEND &amp; PLATFORM ENGINEER</text>
    <text x="0" y="78" class="brand-desc">Distributed Systems • Microservices Architecture • DevOps • AI &amp; RAG Engineering</text>
    <text x="0" y="112" class="brand-desc">3rd-Year Electronics &amp; Communication Engineering (ECE) @ VIT Chennai</text>
  </g>

  <!-- Right Visual Graphics: Node Network & Server Cluster -->
  <g transform="translate(900, 70)" class="float-node">
    <!-- Server Rack Nodes -->
    <rect x="0" y="0" width="220" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="15" y="20" width="190" height="32" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <circle cx="35" cy="36" r="4" fill="#3fb950"/>
    <text x="50" y="40" font-family="monospace" font-size="11" fill="#3fb950" font-weight="bold">MICROSERVICES [UP]</text>

    <rect x="15" y="65" width="190" height="32" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <circle cx="35" cy="81" r="4" fill="#58a6ff"/>
    <text x="50" y="85" font-family="monospace" font-size="11" fill="#58a6ff" font-weight="bold">KAFKA / REDIS [BUS]</text>

    <rect x="15" y="110" width="190" height="32" rx="4" fill="#0d1117" stroke="#bc8cff" stroke-width="1"/>
    <circle cx="35" cy="126" r="4" fill="#bc8cff"/>
    <text x="50" y="130" font-family="monospace" font-size="11" fill="#bc8cff" font-weight="bold">POSTGRES / VECTOR</text>
  </g>
</svg>
