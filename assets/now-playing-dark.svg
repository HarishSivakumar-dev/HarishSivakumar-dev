<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 112" role="img" aria-label="On repeat: Lana Del Rey. Video Games, Summertime Sadness, Young and Beautiful, West Coast, Cinnamon Girl. Click to play.">
<style>
  .kicker { font: 600 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8B949E; letter-spacing: 1px; }
  .title { font: 600 19px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #E6EDF3; opacity: 0; animation: track 30s linear infinite; }
  .artist { font: 400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #8B949E; }
  @keyframes track { 0% { opacity: 0; } 2%, 18% { opacity: 1; } 20%, 100% { opacity: 0; } }
  .progress { transform-box: fill-box; transform-origin: left; animation: play 6s linear infinite; }
  @keyframes play { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .bar { transform-box: fill-box; transform-origin: bottom; animation: eq 1s ease-in-out infinite alternate; }
  @keyframes eq { from { transform: scaleY(0.2); } to { transform: scaleY(1); } }
  
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .packet { display: none; }
}
  @media (prefers-reduced-motion: reduce) { .first { opacity: 1; } .progress { transform: scaleX(0.4); } }
</style>
