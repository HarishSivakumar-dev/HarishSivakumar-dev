<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" style="background:transparent;">
  <defs>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulse-green {
        0%, 100% { fill: #3fb950; filter: drop-shadow(0 0 4px #3fb950); }
        50% { fill: #2ea043; filter: drop-shadow(0 0 1px #2ea043); }
      }
      @keyframes flow-line {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }

      .term-title { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; font-weight: 600; fill: #8b949e; }
      .prompt-user { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #3fb950; }
      .prompt-path { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #58a6ff; }
      .prompt-cmd  { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; fill: #c9d1d9; }
      
      .hero-name   { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 28px; font-weight: 900; fill: #ffffff; letter-spacing: 2px; }
      .hero-role   { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 14px; font-weight: 700; fill: #58a6ff; letter-spacing: 1px; }
      .hero-sub    { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 12px; fill: #8b949e; }
      
      .cursor { fill: #3fb950; animation: blink 1s step-start infinite; }
      .data-flow { stroke: #3fb950; stroke-width: 1.5; stroke-dasharray: 6, 6; animation: flow-line 1.2s linear infinite; }
      .status-dot { animation: pulse-green 2s infinite; }
    </style>
  </defs>

  <!-- Dark Outer Window Container -->
  <rect width="900" height="240" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 892,0 A 8,8 0 0,1 900,8 L 900,36 L 0,36 Z" fill="#161b22"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="#30363d" stroke-width="1"/>
  
  <!-- Window Control Buttons -->
  <circle cx="22" cy="18" r="5.5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5.5" fill="#ffbd2e"/>
  <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="450" y="22" class="term-title" text-anchor="middle">harish@platform-node-01: ~ (zsh)</text>

  <!-- Command Prompt Line 1 -->
  <g transform="translate(30, 62)">
    <text class="prompt-user">harish@platform-node-01</text>
    <text x="210" class="prompt-cmd">:<text class="prompt-path">~</text>$ whoami --verbose</text>
  </g>

  <!-- Identity Info Block -->
  <g transform="translate(30, 95)">
    <text x="0" y="22" class="hero-name">HARISH SIVAKUMAR</text>
    <text x="0" y="48" class="hero-role">❯ JAVA BACKEND &amp; PLATFORM ENGINEER</text>
    <text x="0" y="72" class="hero-sub">[+] 3rd-Year ECE @ VIT Chennai | Distributed Systems &amp; AI Infrastructure</text>
  </g>

  <!-- Microservice Topology Graphic (Right Side) -->
  <g transform="translate(590, 65)">
    <line x1="20" y1="50" x2="90" y2="50" class="data-flow"/>
    <line x1="90" y1="50" x2="160" y2="25" class="data-flow"/>
    <line x1="90" y1="50" x2="160" y2="75" class="data-flow"/>
    <line x1="160" y1="25" x2="230" y2="50" stroke="#30363d" stroke-width="1.5"/>
    <line x1="160" y1="75" x2="230" y2="50" stroke="#30363d" stroke-width="1.5"/>

    <!-- Nodes -->
    <g transform="translate(20, 50)">
      <circle r="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle r="4" fill="#79c0ff"/>
      <text x="0" y="24" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">CLIENT</text>
    </g>
    <g transform="translate(90, 50)">
      <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
      <text x="0" y="4" font-family="monospace" font-size="10" font-weight="bold" fill="#3fb950" text-anchor="middle">GW</text>
      <text x="0" y="24" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">GATEWAY</text>
    </g>
    <g transform="translate(160, 25)">
      <circle r="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle r="3" fill="#3fb950"/>
      <text x="16" y="3" font-family="monospace" font-size="8.5" fill="#8b949e">SERVICES</text>
    </g>
    <g transform="translate(160, 75)">
      <circle r="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle r="3" fill="#3fb950"/>
      <text x="16" y="3" font-family="monospace" font-size="8.5" fill="#8b949e">KAFKA/REDIS</text>
    </g>
    <g transform="translate(230, 50)">
      <circle r="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle r="3" fill="#d2a8ff"/>
      <text x="0" y="22" font-family="monospace" font-size="8.5" fill="#8b949e" text-anchor="middle">DB/VECTOR</text>
    </g>
  </g>

  <!-- Bottom Command Prompt & Status -->
  <g transform="translate(30, 208)">
    <text class="prompt-user">harish@platform-node-01</text>
    <text x="210" class="prompt-cmd">:<text class="prompt-path">~</text>$ status_check --all</text>
    <rect x="382" y="-12" width="9" height="15" class="cursor"/>
    
    <circle cx="710" cy="-4" r="4.5" fill="#3fb950" class="status-dot"/>
    <text x="722" y="0" font-family="monospace" font-size="11" font-weight="bold" fill="#3fb950">SYSTEM_READY</text>
  </g>
</svg>
