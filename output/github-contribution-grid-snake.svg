<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170" style="background:transparent;">
  <defs>
    <style>
      @keyframes snake-move {
        0% { transform: translate(0px, 0px); }
        25% { transform: translate(200px, 40px); }
        50% { transform: translate(450px, 20px); }
        75% { transform: translate(650px, 80px); }
        100% { transform: translate(800px, 50px); }
      }
      .snake-head { fill: #3fb950; animation: snake-move 8s linear infinite alternate; }
    </style>
  </defs>

  <rect width="850" height="170" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>

  <g class="snake-head">
    <rect x="20" y="20" width="10" height="10" fill="#56d364" rx="2"/>
    <rect x="5" y="20" width="10" height="10" fill="#3fb950" rx="2"/>
    <rect x="-10" y="20" width="10" height="10" fill="#2ea043" rx="2"/>
    <rect x="-25" y="20" width="10" height="10" fill="#238636" rx="2"/>
  </g>
</svg>
