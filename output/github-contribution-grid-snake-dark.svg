      @keyframes snake-move {
        0% { transform: translate(0px, 0px); }
        25% { transform: translate(200px, 40px); }
        50% { transform: translate(450px, 20px); }
        75% { transform: translate(650px, 80px); }
        100% { transform: translate(800px, 50px); }
      }
      .snake-head { fill: #3fb950; animation: snake-move 8s linear infinite alternate; }
    </style>
  </defs>

  <rect width="850" height="170" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

