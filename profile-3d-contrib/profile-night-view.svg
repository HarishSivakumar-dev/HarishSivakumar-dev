<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="100%" height="350" style="background:transparent;">
  <defs>
    <style>
      .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .stat-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f0f6fc; }
    </style>
  </defs>

  <rect width="850" height="350" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="820" y="25" font-family="monospace" font-size="10" fill="#484f58" text-anchor="end">LIVE / AUTOMATED DYNAMIC UPDATE</text>

  <!-- 3D Isometric Contribution Grid -->
  <g transform="translate(100, 180) rotate(-25) skewX(50) scale(1, 0.5)">
    <g stroke="#21262d" stroke-width="1">
      <path d="M0,0 L400,0 M0,20 L400,20 M0,40 L400,40 M0,60 L400,60 M0,80 L400,80 M0,100 L400,100 M0,120 L400,120 M0,140 L400,140" fill="none"/>
      <path d="M0,0 L0,140 M30,0 L30,140 M60,0 L60,140 M90,0 L90,140 M120,0 L120,140 M150,0 L150,140 M180,0 L180,140 M210,0 L210,140 M240,0 L240,140 M270,0 L270,140 M300,0 L300,140 M330,0 L330,140 M360,0 L360,140 M390,0 L390,140" fill="none"/>
    </g>
    <g transform="translate(60, 40)"><rect x="0" y="0" width="22" height="22" fill="#2ea043"/><polygon points="0,0 22,0 22,-25 0,-25" fill="#3fb950"/></g>
    <g transform="translate(90, 40)"><rect x="0" y="0" width="22" height="22" fill="#2ea043"/><polygon points="0,0 22,0 22,-40 0,-40" fill="#56d364"/></g>
    <g transform="translate(120, 60)"><rect x="0" y="0" width="22" height="22" fill="#2ea043"/><polygon points="0,0 22,0 22,-15 0,-15" fill="#3fb950"/></g>
    <g transform="translate(180, 80)"><rect x="0" y="0" width="22" height="22" fill="#2ea043"/><polygon points="0,0 22,0 22,-35 0,-35" fill="#56d364"/></g>
    <g transform="translate(210, 80)"><rect x="0" y="0" width="22" height="22" fill="#2ea043"/><polygon points="0,0 22,0 22,-50 0,-50" fill="#3fb950"/></g>
    <g transform="translate(240, 80)"><rect x="0" y="0" width="22" height="22" fill="#2ea043"/><polygon points="0,0 22,0 22,-20 0,-20" fill="#238636"/></g>
    <g transform="translate(270, 100)"><rect x="0" y="0" width="22" height="22" fill="#2ea043"/><polygon points="0,0 22,0 22,-45 0,-45" fill="#56d364"/></g>
    <g transform="translate(300, 100)"><rect x="0" y="0" width="22" height="22" fill="#2ea043"/><polygon points="0,0 22,0 22,-60 0,-60" fill="#3fb950"/></g>
  </g>

  <!-- 5-Axis Radar Chart -->
  <g transform="translate(680, 120)">
    <polygon points="0,-60 57,-18 35,48 -35,48 -57,-18" fill="none" stroke="#21262d" stroke-width="1.2"/>
    <polygon points="0,-40 38,-12 23,32 -23,32 -38,-12" fill="none" stroke="#21262d" stroke-width="1.2"/>
    <polygon points="0,-20 19,-6 12,16 -12,16 -19,-6" fill="none" stroke="#21262d" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#21262d"/><line x1="0" y1="0" x2="57" y2="-18" stroke="#21262d"/><line x1="0" y1="0" x2="35" y2="48" stroke="#21262d"/><line x1="0" y1="0" x2="-35" y2="48" stroke="#21262d"/><line x1="0" y1="0" x2="-57" y2="-18" stroke="#21262d"/>
    <polygon points="0,-48 42,-14 25,35 -20,20 -38,-12" fill="#2ea043" opacity="0.45" stroke="#3fb950" stroke-width="2"/>
    <text x="0" y="-68" class="label-text" text-anchor="middle">Commit</text>
    <text x="68" y="-18" class="label-text" text-anchor="start">Issue</text>
    <text x="42" y="60" class="label-text" text-anchor="start">PullReq</text>
    <text x="-42" y="60" class="label-text" text-anchor="end">Review</text>
    <text x="-68" y="-18" class="label-text" text-anchor="end">Repo</text>
  </g>

  <!-- Donut Chart -->
  <g transform="translate(100, 240)">
    <circle cx="45" cy="45" r="35" fill="none" stroke="#e34c26" stroke-width="14" stroke-dasharray="75 145" transform="rotate(-90 45 45)"/>
    <circle cx="45" cy="45" r="35" fill="none" stroke="#3776ab" stroke-width="14" stroke-dasharray="55 165" transform="rotate(30 45 45)"/>
    <circle cx="45" cy="45" r="35" fill="none" stroke="#f1e05a" stroke-width="14" stroke-dasharray="40 180" transform="rotate(120 45 45)"/>
    <circle cx="45" cy="45" r="35" fill="none" stroke="#007acc" stroke-width="14" stroke-dasharray="30 190" transform="rotate(180 45 45)"/>
    <g transform="translate(100, 15)">
      <rect x="0" y="0" width="10" height="10" fill="#e34c26" rx="2"/><text x="16" y="9" class="label-text">Java / Spring</text>
      <rect x="0" y="16" width="10" height="10" fill="#3776ab" rx="2"/><text x="16" y="25" class="label-text">Python / C++</text>
      <rect x="0" y="32" width="10" height="10" fill="#f1e05a" rx="2"/><text x="16" y="41" class="label-text">HTML/CSS</text>
      <rect x="0" y="48" width="10" height="10" fill="#007acc" rx="2"/><text x="16" y="57" class="label-text">JavaScript / SQL</text>
    </g>
  </g>
</svg>
