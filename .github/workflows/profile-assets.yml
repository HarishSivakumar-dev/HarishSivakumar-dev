name: Profile assets

on:
  schedule:
    - cron: '17 2 * * *' # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate cards
        run: node scripts/build-cards.mjs dist
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: |
            dist/snake-dark.svg?color_snake=#F5A524&color_dots=#161B22,#0F3D3A,#136F63,#1FA38F,#2DD4BF&color_dot_border=#30363D
            dist/snake-light.svg?color_snake=#B45309&color_dots=#EEF1F4,#A7E3DA,#5EC4B6,#1F9E8F,#0F766E&color_dot_border=#D0D7DE

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
