<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Now playing: Lana Del Rey / Harish Sivakumar</title>
  <style>
    :root { --bg: #ffffff; --text: #1f2328; --muted: #57606a; --link: #0f766e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --text: #e6edf3; --muted: #8b949e; --link: #2dd4bf; }
    }
    body {
      margin: 0 auto; max-width: 640px; padding: 48px 20px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0 0 24px; color: var(--muted); }
    iframe { display: block; width: 100%; height: 452px; border: 0; border-radius: 12px; }
    a { color: var(--link); }
    .back { margin: 24px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <h1>On repeat: Lana Del Rey</h1>
  <p>Press play. Sign in to Spotify for full tracks; otherwise you may only hear previews.</p>
  <iframe
    title="Lana Del Rey on Spotify"
    src="https://open.spotify.com/embed/artist/00FQb4jTyendYWaN8pK0wa"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy"></iframe>
  <p class="back"><a href="https://github.com/HarishSivakumar-dev">Back to Harish's profile</a></p>
</body>
</html>
